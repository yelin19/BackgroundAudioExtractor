name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: EAS preview APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start EAS preview build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cp app.config.ts /tmp/app.config.ts.backup
          set +e
          npx eas-cli@latest init --account yelin20187s-team --non-interactive
          INIT_STATUS=$?
          set -e
          test -f .eas/project.json || (echo "EAS project initialization did not create .eas/project.json"; exit "$INIT_STATUS")
          EAS_PROJECT_ID=$(node -p "require('./.eas/project.json').projectId")
          test -n "$EAS_PROJECT_ID" || (echo "EAS project ID is empty"; exit 1)
          cp /tmp/app.config.ts.backup app.config.ts
          export EAS_PROJECT_ID
          npx eas-cli@latest build --platform android --profile preview --non-interactive
